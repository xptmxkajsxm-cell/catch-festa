name: TourAPI 축제 매일 갱신

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: TourAPI에서 축제 받아오기
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/update-tour.mjs
      - name: 바뀐 내용 저장
        run: |
          git config user.name "catchfesta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tour.json
          git diff --cached --quiet || git commit -m "TourAPI 축제 갱신"
          git push
